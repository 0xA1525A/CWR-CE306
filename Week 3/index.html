<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Electronic Ledger</title>
        <link rel="stylesheet" type="text/css" href="./styles/style.css">
    </head>
    <body>
        <aside id="sidebar" class="sidebar">
            <div class="header-container">
                <h1>E-Ledger</h1>
                <span>Income/Expense Recorder</span>
            </div>
            <div class="button-container">
                <h3>Search</h3>
                <input type="text" placeholder="What are you looking for?">
                <button class="important">
                    <img src="./assets/search.svg">
                    <span>Search</span>
                </button>
                <button>
                    <img src="./assets/delete-white.svg">
                    <span>Clear Search</span>
                </button>
                <h3>Filter</h3>
                <select name="" id="type" value="">
                    <option value="">Unspecified Type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
                <select name="" id="sub-category" value="">
                    <option value="">Unspecified Sub-Category</option>
                    <option value="expense">Salary</option>
                    <option value="expense">Travel/Vacation</option>
                    <option value="expense">Transfer</option>
                    <option value="expense">Business Purchase</option>
                    <option value="expense">Investment</option>
                </select>
                <button class="important">
                    <img src="./assets/filter.svg">
                    <span>Apply Filter</span>
                </button>
                <button>
                    <img src="./assets/no-filter.svg">
                    <span>Clear Filter</span>
                </button>
                <h3>Ledger Menu</h3>
                <button class="important">
                    <img src="./assets/note-add.svg">
                    <span>Add New Record</span>
                </button>
                <button>
                    <img src="./assets/chart.svg">
                    <span>See Overview</span>
                </button>
                <button>
                    <img src="./assets/sigma.svg">
                    <span>Get Specfic Summary</span>
                </button>
                <button>
                     <img src="./assets/trash.svg">
                    <span>Remove All Records</span>
                </button>
            </div>
        </aside>
        <main id="main" class="main"></main>
        <dialog id="add-new-record-dialogue" open>
            <div class="header-container">
                <h3>Add New Record</h3>
                <span>Enter with absolute caution, this cannot be modified later.</span>
            </div>
            <div class="form-container">
                <div class="input-container">
                    <input type="text" id="" placeholder="Record Title">
                    <input type="number" placeholder="0 THB ">
                </div>
                <textarea id="" placeholder="And a little more details..."></textarea>
                <div class="select-container">
                    <select id="">
                        <option value="">Unspecified Type</option>
                        <option value="income">I Earned</option>
                        <option value="expense">I Spent</option>
                    </select>
                    <select id="">
                        <option value="">Unspecified Sub-Category</option>
                        <option value="expense">On Salary</option>
                        <option value="expense">On Travel/Vacation</option>
                        <option value="expense">On Transfer</option>
                        <option value="expense">On Business Purchase</option>
                        <option value="expense">On Investment</option>
                    </select>
                </div>
            </div>
            <div class="button-container">
                <button>
                    <img src="./assets/xmark.svg">
                    <span>Close</span>
                </button>
                <button>
                    <img src="./assets/delete.svg">
                    <span>Clear All</span>
                </button>
                <button class="important">
                    <img src="./assets/note-add-white.svg">
                    <span>Add New Record</span>
                </button>
            </div>
        </dialog>
        <dialog id="remove-all-confirmation-dialogue">
            <div class="header-container">
                <h3>Are you sure?</h3>
                <span>Removing all records, this action <b>CANNOT</b> be undone.</span>
            </div>
            <div class="button-container all-equals">
                <button>
                    <img src="./assets/xmark.svg">
                    <span>Cancel - Don't Touch Them</span>
                </button>
                <button class="important">
                    <img src="./assets/trash.svg">
                    <span>Confirm - Remove All Records</span>
                </button>
            </div>
        </dialog>
        <script src="./scripts/script.js"></script>
    </body>
</html>
